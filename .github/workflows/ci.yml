name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install monorepo dependencies
        run: npm install --no-audit --no-fund

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Lint web
        run: npm run lint

      - name: Typecheck web
        run: npm run typecheck

      - name: Run unit tests (web, demo backend, desktop helpers)
        run: npx --yes tsx --test apps/web/src/lib/demo-backend.test.ts apps/web/src/lib/demo-persistence.test.ts apps/web/src/lib/desktop-receipt.test.ts apps/desktop/src/receipt-html.test.ts

      - name: Build web production standalone bundle
        run: npm run build

      - name: Verify Electron desktop TypeScript & standalone staging
        working-directory: apps/desktop
        run: |
          npm install --no-audit --no-fund
          npm run generate:icons
          npm run typecheck
          npm run build:main
          npm run prepare:standalone
