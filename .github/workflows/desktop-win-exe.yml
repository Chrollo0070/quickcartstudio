name: Build Windows Desktop (.exe)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Windows target to package'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - nsis
          - portable
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-win-exe:
    name: Package QuickCart Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install monorepo dependencies & build Next.js standalone
        run: |
          npm ci || npm install
          npm run build

      - name: Install Electron desktop dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Generate Windows icons & stage Next.js standalone runtime
        working-directory: apps/desktop
        run: |
          node scripts/generate-icons.mjs
          npm run build:main
          npm run prepare:standalone

      - name: Package Windows .exe
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $target = "${{ github.event.inputs.target || 'all' }}"
          if ($target -eq "portable") {
            npm run dist:portable
          } else {
            npm run dist:win
          }

      - name: Generate SHA-256 checksums
        working-directory: apps/desktop/release
        shell: pwsh
        run: |
          Get-ChildItem -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Upload Windows .exe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quickcart-windows-exe
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attach .exe binaries to GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/release/*.exe
            apps/desktop/release/SHA256SUMS.txt
